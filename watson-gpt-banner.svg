<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-label="WATSON GPT — world and tether search — Sherlock Holmes styled banner">
  <defs>
    <!-- Victorian night palette -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a1c"/>
      <stop offset="0.45" stop-color="#14282a"/>
      <stop offset="1" stop-color="#1b1410"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8b45e" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#c8893b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c8893b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6a8"/>
      <stop offset="0.5" stop-color="#e6b85c"/>
      <stop offset="1" stop-color="#b9822f"/>
    </linearGradient>
    <linearGradient id="tether" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9822f" stop-opacity="0.2"/>
      <stop offset="0.35" stop-color="#ffe3a0"/>
      <stop offset="0.7" stop-color="#f0c368"/>
      <stop offset="1" stop-color="#b9822f" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#cfeef0" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#7fb9bd" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0d1a1c" stop-opacity="0.05"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.62" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>

    <!-- Tweed check for the deerstalker -->
    <pattern id="tweed" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <rect width="16" height="16" fill="#3a2a1d"/>
      <path d="M0 0H16 M0 8H16 M0 0V16 M8 0V16" stroke="#6d5334" stroke-width="2" opacity="0.7"/>
      <path d="M0 4H16 M4 0V16" stroke="#241a12" stroke-width="1" opacity="0.6"/>
    </pattern>

    <clipPath id="hatClip">
      <path d="M22,44 C26,20 40,8 62,5 C92,1 118,6 136,24 L142,36 L112,40 L40,48 Z"/>
    </clipPath>
    <clipPath id="lensClip">
      <circle cx="372" cy="252" r="56"/>
    </clipPath>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="500" fill="url(#bg)"/>
  <ellipse cx="240" cy="210" rx="360" ry="320" fill="url(#lamp)"/>

  <!-- London skyline: rooftops and chimneys -->
  <g fill="#0a1416" opacity="0.85">
    <path d="M0 500 L0 372 L60 372 L60 340 L86 340 L86 372 L150 372 L150 330 L176 330 L176 306 L196 306 L196 330 L226 330 L226 380 L300 380 L300 350 L330 350 L330 372 L410 372 L410 500 Z"/>
    <path d="M1080 500 L1080 388 L1140 388 L1140 356 L1166 356 L1166 388 L1240 388 L1240 360 L1270 360 L1270 388 L1360 388 L1360 500 Z"/>
  </g>

  <!-- Fog banks -->
  <g fill="#c9d6cf" opacity="0.06" filter="url(#soft)">
    <ellipse cx="420" cy="430" rx="520" ry="70"/>
    <ellipse cx="1180" cy="460" rx="560" ry="60"/>
    <ellipse cx="760" cy="250" rx="420" ry="40"/>
  </g>

  <!-- Golden tether thread winding across the banner -->
  <path d="M20,430 C220,415 300,320 470,312 C650,304 700,190 900,186 C1100,182 1210,128 1580,112"
        fill="none" stroke="url(#tether)" stroke-width="2.5" opacity="0.9" filter="url(#glow)"/>
  <g fill="#ffe3a0" filter="url(#glow)">
    <circle cx="470" cy="312" r="5"/><circle cx="900" cy="186" r="5"/>
    <circle cx="1210" cy="132" r="4"/><circle cx="300" cy="352" r="3.5"/>
  </g>
  <g fill="none" stroke="#ffdf9a" stroke-width="1" opacity="0.5">
    <circle cx="470" cy="312" r="12"/><circle cx="900" cy="186" r="12"/>
  </g>

  <!-- Sherlock Holmes silhouette (local coords, scaled into the left panel) -->
  <g transform="translate(96,58) scale(1.22)">
    <!-- Body / head profile facing right -->
    <path d="M20,300
             C20,240 30,210 55,190
             C60,180 62,170 60,158
             C72,150 78,140 80,128
             C92,122 100,116 104,108
             C110,104 108,98 112,92
             C120,88 124,82 122,74
             C118,68 116,64 114,56
             C112,48 110,42 112,36
             L140,34
             C136,24 126,14 110,10
             C90,4 60,6 44,14
             C30,20 24,30 22,42
             C18,56 12,72 10,90
             C6,112 4,140 6,170
             C8,210 12,260 20,300 Z"
          fill="#081113"/>
    <!-- Tweed crown -->
    <g clip-path="url(#hatClip)">
      <rect x="0" y="0" width="160" height="60" fill="url(#tweed)" opacity="0.5"/>
    </g>
    <!-- Rim light on the profile edge -->
    <path d="M112,36 C110,42 112,48 114,56 C116,64 118,68 122,74 C124,82 120,88 112,92 C108,98 110,104 104,108 C100,116 92,122 80,128"
          fill="none" stroke="#e8b45e" stroke-width="1.6" opacity="0.7"/>
    <!-- Briar pipe -->
    <path d="M112,92 C130,96 144,102 152,110" fill="none" stroke="#c8893b" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="158" cy="120" rx="11" ry="15" transform="rotate(28 158 120)" fill="#3a2417" stroke="#e8b45e" stroke-width="1.5"/>
    <!-- Pipe smoke -->
    <g fill="none" stroke="#d9e2dc" stroke-width="2.2" opacity="0.35" stroke-linecap="round">
      <path d="M160,102 C150,84 176,76 166,56 C158,40 182,32 172,12"/>
      <path d="M176,110 C170,96 190,88 182,72" opacity="0.6"/>
    </g>
  </g>

  <!-- Magnifying glass raised before the scene -->
  <g filter="url(#glow)">
    <circle cx="372" cy="252" r="58" fill="url(#lens)" stroke="#e8b45e" stroke-width="5"/>
    <circle cx="372" cy="252" r="51" fill="none" stroke="#ffe6a8" stroke-width="1" opacity="0.6"/>
    <!-- refracted tether glint inside the lens -->
    <g clip-path="url(#lensClip)" opacity="0.9">
      <path d="M310,300 C350,270 400,250 440,200" fill="none" stroke="#ffe3a0" stroke-width="2"/>
      <circle cx="372" cy="252" r="4" fill="#fff4cf"/>
    </g>
    <path d="M356,232 C364,224 376,222 386,228" fill="none" stroke="#fff" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
    <!-- handle -->
    <path d="M413,293 L472,352" stroke="#3a2417" stroke-width="16" stroke-linecap="round"/>
    <path d="M413,293 L472,352" stroke="#c8893b" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Right-hand title panel -->
  <rect x="600" y="60" width="960" height="380" fill="url(#vignette)" opacity="0.35"/>
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="636" y="118" fill="#c9a35c" font-size="20" letter-spacing="9" font-variant="small-caps">221B · Baker Street</text>

    <text x="632" y="238" fill="url(#gold)" font-size="96" font-weight="bold" letter-spacing="3">WATSON GPT</text>

    <path d="M640,268 L1500,268" stroke="#c8893b" stroke-width="1.5" opacity="0.8"/>
    <path d="M1010,268 l10,-7 l10,7 l-10,7 Z" fill="#e8b45e"/>

    <!-- WATSON = World And Tether Search oNline; highlighted letters spell the name -->
    <text x="640" y="318" fill="#d9c08a" font-size="26" letter-spacing="6"><tspan fill="#ffe6a8" font-weight="bold" text-decoration="underline">W</tspan>ORLD <tspan fill="#ffe6a8" font-weight="bold" text-decoration="underline">A</tspan>ND <tspan fill="#ffe6a8" font-weight="bold" text-decoration="underline">T</tspan>ETHER <tspan fill="#ffe6a8" font-weight="bold" text-decoration="underline">S</tspan>EARCH <tspan fill="#ffe6a8" font-weight="bold" text-decoration="underline">O</tspan><tspan fill="#ffe6a8" font-weight="bold" text-decoration="underline">N</tspan>LINE</text>

    <text x="640" y="366" fill="#9fb0ad" font-size="21" font-style="italic">"In search of the element of truth, one thread at a time."</text>
  </g>

  <!-- Double decorative border -->
  <rect x="16" y="16" width="1568" height="468" fill="none" stroke="#c8893b" stroke-width="2" opacity="0.75" rx="6"/>
  <rect x="24" y="24" width="1552" height="452" fill="none" stroke="#c8893b" stroke-width="1" opacity="0.4" rx="4"/>
  <g fill="#e8b45e">
    <circle cx="16" cy="16" r="4"/><circle cx="1584" cy="16" r="4"/>
    <circle cx="16" cy="484" r="4"/><circle cx="1584" cy="484" r="4"/>
  </g>
</svg>
